<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8d75bd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kartu Pasien - Irfan</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #9882c4;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    /* Layar transisi awal saat iframe Google Apps Script dimuat */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #9882c4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.35s ease;
    }

    #splash img {
      width: 84px;
      height: 84px;
      margin-bottom: 16px;
      animation: pulse 1.2s infinite ease-in-out;
    }

    #splash p {
      color: #1e1336;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="splash">
    <img src="./icon.svg" alt="Ikon Kartu Pasien">
    <p>Membuka Kartu Pasien...</p>
  </div>

  <iframe 
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbzBX3qXETAw3f7SCLANQ9NFf8nTmkDix7SJU05sefXIafqeyewxJ3I89uO2leZcpD5q/exec"
    allow="clipboard-write"
    onload="hideSplash()">
  </iframe>

  <script>
    function hideSplash() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 350);
      }
    }

    // Daftarkan Service Worker agar memenuhi syarat instalasi PWA Android
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker aktif:', reg.scope))
          .catch(err => console.error('PWA Service Worker gagal:', err));
      });
    }
  </script>

</body>
</html>
